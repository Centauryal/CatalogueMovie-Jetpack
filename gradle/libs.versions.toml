[versions]
# Plugins
agp = "8.11.2"
kotlin = "2.3.20"
kotlinKsp = "2.1.20-1.0.32"

# Androidx Dependencies
coreKtx = "1.18.0"
androidAnnotation = "1.10.0"
androidLegacy = "1.0.0"
appCompact = "1.7.1"
constraintLayout = "2.2.1"
material = "1.13.0"
cardView = "1.0.0"
recyclerView = "1.4.0"
room = "2.8.4"
fragmentKtx = "1.8.9"
composeBom = "2026.03.01"
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.10.0"

# Network
retrofit2 = "3.0.0"
loggingInterceptor = "5.3.2"

# DI
daggerHilt = "2.59.2"
rxJava = "2.2.21"
rxAndroid = "2.1.1"

# Common Dependencies
# removeRxJava = "Remove RxJava with Coroutine Flow"
coil = "3.4.0"
timber = "5.0.1"
shimmer = "0.5.0"
# changeShimmer = "TODO Change shimmer jetpack compose"
lottie = "6.7.1"
intuit = "1.1.1"
# removeIntuit = "Remove Intuit"
sqlCipher = "4.5.4"
# removeSqlCipher = "Remove Sql Cipher"
sqlCipherAndroid = "4.14.1"

# Test Dependencies
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
leakCanary = "2.14"

[libraries]
# Androidx Dependencies
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-app-compact = { group = "androidx.appcompat", name = "appcompat", version.ref = "appCompact" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidAnnotation" }
androidx-legacy = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "androidLegacy" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraint-layout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardView" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerView" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityCompose" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-room = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-room-rxjava2 = { group = "androidx.room", name = "room-rxjava2", version.ref = "room" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# Network
retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit2" }
retrofit2-adapter = { group = "com.squareup.retrofit2", name = "adapter-rxjava2", version.ref = "retrofit2" }
retrofit2-converter = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit2" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }

# DI
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "daggerHilt" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "daggerHilt" }
dagger-hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "daggerHilt" }
dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "daggerHilt" }
rxjava2 = { group = "io.reactivex.rxjava2", name = "rxjava", version.ref = "rxJava" }
rxjava2-android = { group = "io.reactivex.rxjava2", name = "rxandroid", version.ref = "rxAndroid" }

# Common Dependencies
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-compose-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
facebook-shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
sdp-android = { group = "com.intuit.sdp", name = "sdp-android", version.ref = "intuit" }
ssp-android = { group = "com.intuit.ssp", name = "ssp-android", version.ref = "intuit" }
sql-cipher-database = { group = "net.zetetic", name = "android-database-sqlcipher", version.ref = "sqlCipher" }
sql-cipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlCipherAndroid" }

# Test Dependencies
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
leak-canary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakCanary" }

[bundles]
app = [
    "androidx-core-ktx",
    "androidx-app-compact",
    "androidx-material",
    "androidx-constraint-layout",
    "androidx-cardview",
    "androidx-recyclerview",
    "androidx-annotation",
    "androidx-legacy",
    "androidx-activity-ktx",
    "androidx-fragment-ktx",
    "androidx-lifecycle-runtime-ktx",
    "androidx-material3",
    "androidx-activity-compose",
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling-preview",
    "dagger",
    "dagger-hilt",
    "rxjava2",
    "rxjava2-android",
    "coil-compose",
    "coil-compose-network",
    "facebook-shimmer",
    "lottie",
    "lottie-compose",
    "sdp-android",
    "ssp-android",
    "timber"
]
kspApp = [
    "dagger-compiler",
    "dagger-hilt-compiler"
]
androidTestApp = [
    "androidx-ui-test-junit4",
    "androidx-junit",
    "androidx-espresso-core"
]
debugApp = [
    "androidx-ui-tooling",
    "androidx-ui-test-manifest",
    "leak-canary"
]
data = [
    "dagger",
    "dagger-hilt",
    "rxjava2",
    "sql-cipher-database",
    "sql-cipher"
]
kspData = [
    "dagger-compiler",
    "dagger-hilt-compiler",
    "androidx-room-compiler"
]
apiData = [
    "androidx-room",
    "androidx-room-ktx",
    "androidx-room-paging",
    "androidx-room-rxjava2",
    "retrofit2",
    "retrofit2-adapter",
    "retrofit2-converter",
    "logging-interceptor"
]
domain = [
    "dagger",
    "dagger-hilt",
    "rxjava2",
    "rxjava2-android"
]
test = [
    "junit"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-dynamic-feature = { id = "com.android.dynamic-feature", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kotlinKsp" }
dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }

